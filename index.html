<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors</title>
  </head>
  <body>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>
    <button id="playAgain">Play Again</button>
    <br></br>
    <div id="output"></div>
    <div id="score"></div>
    <br></br>
    <div id="finalMessage"></div>

    

    <script>
      let humanScore = 0;
      let computerScore = 0;

      function getComputerChoice() {
        const choices = ["rock", "paper", "scissors"];
        return choices[Math.floor(Math.random() * 3)];
      }

      function playRound(humanChoice, computerChoice) {
        let result = "";
        if (humanChoice === computerChoice) {
          result = "It's a draw!";
        } else if (
          (humanChoice === "rock" && computerChoice === "scissors") ||
          (humanChoice === "paper" && computerChoice === "rock") ||
          (humanChoice === "scissors" && computerChoice === "paper")
        ) {
          result = "You win!";
          humanScore++;
        } else {
          result = "You lose!";
          computerScore++;
        }

        document.querySelector("#output").textContent = 
        `${humanChoice.charAt(0).toUpperCase() + humanChoice.slice(1)} vs ` + 
        `${computerChoice.charAt(0).toUpperCase() + computerChoice.slice(1)}:`+ 
        `${result}`;

        updateScore();
        checkWinner();
      }

      function updateScore() {
        document.querySelector("#score").textContent = `Your Score: ${humanScore} | Computer Score: ${computerScore}`;
      }
      function checkWinner() {
        if (humanScore === 5) {
          endGame("🎉 You win the match!");
        } else if (computerScore === 5) {
          endGame("💀 Computer wins the match!");
        }
      }

      function endGame(message) {
        document.querySelector("#finalMessage").textContent = message;

        // disable game buttons
        document.getElementById("rock").disabled = true;
        document.getElementById("paper").disabled = true;
        document.getElementById("scissors").disabled = true;

        // show restart button
        document.getElementById("playAgain").style.display = "inline-block";
      }

      document.getElementById("playAgain").addEventListener("click", () => {
        humanScore = 0;
        computerScore = 0;

        document.querySelector("#output").textContent = "";
        document.querySelector("#score").textContent = "";
        document.querySelector("#finalMessage").textContent = "";

        document.getElementById("rock").disabled = false;
        document.getElementById("paper").disabled = false;
        document.getElementById("scissors").disabled = false;

        document.getElementById("playAgain").style.display = "none";
      });

      document.getElementById("rock").addEventListener("click", () => {
        let computerChoice = getComputerChoice();
        playRound("rock", computerChoice);
      });

      document.getElementById("paper").addEventListener("click", () => {
        let computerChoice = getComputerChoice();
        playRound("paper", computerChoice);
      });

      document.getElementById("scissors").addEventListener("click", () => {
        let computerChoice = getComputerChoice();
        playRound("scissors", computerChoice);
      });
    </script>
  </body>
</html>
